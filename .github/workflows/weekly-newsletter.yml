name: Weekly finance newsletter

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday at 07:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Debug secrets env: GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }} GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} run: | echo "Longueur adresse: ${#GMAIL_ADDRESS}" echo "Longueur mot de passe: ${#GMAIL_APP_PASSWORD}"
      - name: Run newsletter script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
